  <h1>ポケットツールズ</h1>
  <p>猫・犬・子どもの毎日の「記録」を軽くするアプリを作っています。記録機能は無料・広告なしです。</p>
  <ul>
      <li><a href="/nyanjin/"><strong>にゃん腎ノート</strong></a> — 猫の腎臓病ケア記録アプリ。皮下点滴・投薬・体重をワンタップ30秒で記録。</li>
      <li><a href="/nyanto/"><strong>にゃん糖ノート</strong></a> — 猫の糖尿病ケア記録アプリ。インスリン・血糖値・体重をワンタップで記録。</li>
      <li><a href="/wanshin/"><strong>わん心ノート</strong></a> — 犬の心臓病ケア記録アプリ。安静時呼吸数をタップで計測、お薬・体重も記録。</li>
      <li><a href="/arekko/"><strong>アレルギーっ子ノート</strong></a> — 子どもの食物アレルギー記録アプリ。食事・症状・負荷試験の記録を1冊に。</li>
  </ul>
